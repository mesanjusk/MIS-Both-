# Keeps the Render free-tier backend from idling.
#
# The daily jobs (morning/evening digests, owner summary, stuck-files digest,
# attendance check-in) run on setInterval inside the web process. A free Render
# service sleeps after fifteen minutes without traffic, and a sleeping process
# runs no timers — so overnight the service is reliably asleep by 08:00 and
# 09:00, exactly when those jobs are due.
#
# dailyScheduleService makes a missed slot recoverable: the job still runs when
# the process next wakes, as long as it wakes inside the job's catch-up window.
# This keeps it awake so the slot is not missed in the first place. Both halves
# are wanted — a ping can fail, and catch-up is what covers that.
#
# Mirrors the same workflow in the Metabsp repo.
name: Render Keep Alive

on:
  schedule:
    # Every 12 minutes, comfortably inside Render's 15-minute idle window.
    # GitHub's scheduler is best-effort and can run late under load, which is
    # the other reason the catch-up logic exists.
    - cron: '*/12 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        env:
          # Set RENDER_KEEPALIVE_URL if the backend ever moves. The default is
          # the host MISFrontend/.env.production points VITE_API_SERVER at —
          # the deployment that actually serves the app, which is not the only
          # one this repo builds. "/" is the health route; it answers
          # { ok, service, release } with the deployed commit.
          CONFIGURED_URL: ${{ secrets.RENDER_KEEPALIVE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          URL="${CONFIGURED_URL:-https://misbackend-e078.onrender.com/}"
          echo "Pinging backend health endpoint..."

          # Generous timeouts: a sleeping free instance takes 20-40s to boot,
          # and a ping that gives up early would leave it asleep.
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "$URL" >/dev/null

          echo "Keep-alive ping succeeded."
