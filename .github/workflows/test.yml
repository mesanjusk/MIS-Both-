name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MISBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MISBackend/package-lock.json
      - run: npm ci

      # A file that does not parse takes the service down on boot, so this runs
      # before the tests: it fails in a second and names the file, where a test
      # run would fail slowly and less clearly.
      - name: Syntax check
        run: npm run lint:syntax

      - name: Backend tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MISFrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MISFrontend/package-lock.json
      - run: npm ci

      # Blocking. Only the rules that catch code which cannot work — undefined
      # references, conditional hooks, redeclarations, unsafe finally. The
      # project's remaining ~1400 legacy findings (mostly react/prop-types) are
      # inventoried in docs/LINT_TECHNICAL_DEBT.md and are NOT gated here: a
      # permanently red build is one nobody reads.
      - name: Critical lint
        run: npm run lint:critical

      - name: Frontend tests
        run: npm test

      # The production build was previously not run in CI at all, so a change
      # that broke the build merged green and only failed on Vercel — after
      # merge, in front of users. This is the job that closes that gap.
      - name: Production build
        run: npm run build
